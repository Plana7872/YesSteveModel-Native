name: build-native

on:
  workflow_dispatch:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force diagnostics | Out-Null
          $log = 'diagnostics/toolchain.log'
          function w($m) { "$((Get-Date).ToString('HH:mm:ss')) $m" | Add-Content $log }
          $llvm = @('C:\Program Files\LLVM\bin', 'C:\Program Files (x86)\LLVM\bin') |
            Where-Object { Test-Path (Join-Path $_ 'clang-cl.exe') } | Select-Object -First 1
          if (-not $llvm) { throw 'clang-cl.exe not found under the known LLVM directories' }
          $llvm | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          "CC=clang-cl`nCXX=clang-cl`nCFLAGS=-fuse-ld=lld`nCXXFLAGS=-fuse-ld=lld`nLDFLAGS=-fuse-ld=lld" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $banner = (& (Join-Path $llvm 'clang-cl.exe') --version | Select-Object -First 1)
          $major = [regex]::Match($banner, '\d+').Value
          "YSM_CLANG_MAJOR=$major" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          w "llvm=$llvm $banner"
          $zip = Join-Path $env:RUNNER_TEMP 'nasm.zip'
          curl.exe -fSsL --retry 2 --max-time 300 -o $zip 'https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/win64/nasm-2.16.03-win64.zip'
          if ($LASTEXITCODE -ne 0) { throw "nasm download failed ($LASTEXITCODE)" }
          Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'nasm') -Force
          $dir = (Get-ChildItem (Join-Path $env:RUNNER_TEMP 'nasm') -Recurse -Filter nasm.exe).DirectoryName |
            Select-Object -First 1
          $dir | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          w "nasm=$dir"

      - name: pip tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $log = 'diagnostics/pip.log'
          function w($m) { "$((Get-Date).ToString('HH:mm:ss')) $m" | Add-Content $log }
          python -m pip install --upgrade "conan>=2.28" "cmake>=3.29" ninja *>&1 | Add-Content $log
          if ($LASTEXITCODE -ne 0) { throw "pip install failed ($LASTEXITCODE)" }
          $conan = Join-Path (Split-Path (Get-Command python).Source) 'Scripts\conan.exe'
          if (-not (Test-Path $conan)) { throw "conan.exe missing at $conan" }
          $conan | Split-Path | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          "YSM_CONAN=$conan" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          w "$(& $conan --version 2>&1)"

      - name: git probe
        shell: cmd
        run: |
          if not exist diagnostics mkdir diagnostics
          git --version > "diagnostics\git.log" 2>&1
          git ls-remote https://github.com/google/benchmark refs/tags/v1.10.0 >> "diagnostics\git.log" 2>&1
          echo ls-remote=%ERRORLEVEL% >> "diagnostics\git.log"
          git clone --depth 1 -b v1.10.0 https://github.com/google/benchmark "%RUNNER_TEMP%\probe-benchmark" >> "diagnostics\git.log" 2>&1
          echo clone-benchmark=%ERRORLEVEL% >> "diagnostics\git.log"
          type "diagnostics\git.log"

      - name: setup
        shell: cmd
        run: |
          set CONAN_HOME=%CD%\conan\cache
          if not exist diagnostics mkdir diagnostics
          call bootstrap.cmd setup > "diagnostics\setup.log" 2>&1
          if errorlevel 1 ( exit /b 1 )

      - name: profile
        shell: cmd
        run: |
          set CONAN_HOME=%CD%\conan\cache
          if not exist "%CONAN_HOME%\profiles" mkdir "%CONAN_HOME%\profiles"
          set "P=%CONAN_HOME%\profiles\default"
          echo profile start > "diagnostics\conan.log"
          > "%P%" echo [settings]
          >> "%P%" echo os=Windows
          >> "%P%" echo arch=x86_64
          >> "%P%" echo build_type=Release
          >> "%P%" echo compiler=clang
          >> "%P%" echo compiler.version=%YSM_CLANG_MAJOR%
          >> "%P%" echo compiler.runtime_version=v144
          >> "%P%" echo compiler.cppstd=23
          >> "%P%" echo compiler.runtime=static
          >> "%P%" echo compiler.runtime_type=Release
          >> "%P%" echo.
          >> "%P%" echo [conf]
          >> "%P%" echo tools.build:compiler_executables={"c": "clang-cl", "cpp": "clang-cl"}
          type "%P%" >> "diagnostics\conan.log"
          conan profile show -pr default >> "diagnostics\conan.log" 2>&1
          echo profile-show=%ERRORLEVEL% >> "diagnostics\conan.log"

      - name: patch flags
        shell: cmd
        run: |
          python -c "import pathlib;p=pathlib.Path('conan/cmake/targets/windows-x64.cmake');s=p.read_text();before=len(s);s=s.replace('        -funique-source-file-names\n','').replace('        -fsplit-lto-unit\n','').replace('        -fwhole-program-vtables\n','').replace('        -fforce-emit-vtables\n','');p.write_text(s);print('patched',before,'->',len(s));print(s)" > "diagnostics\patch.log" 2>&1
          set RC=%ERRORLEVEL%
          type "diagnostics\patch.log"
          if not "%RC%"=="0" exit /b 1


      - name: build
        shell: cmd
        run: |
          set CONAN_HOME=%CD%\conan\cache
          call bootstrap.cmd build native --deps-only > "diagnostics\deps.log" 2>&1
          if errorlevel 1 ( type "diagnostics\deps.log" & exit /b 1 )
          > "diagpatch.py" echo import glob, pathlib
          >> "diagpatch.py" echo hit = 0
          >> "diagpatch.py" echo fs = glob.glob('conan/cache/**/compatibility_check.h', recursive=True)
          >> "diagpatch.py" echo print('candidates', len(fs), fs[:5])
          >> "diagpatch.py" echo for f in fs:
          >> "diagpatch.py" echo     p = pathlib.Path(f)
          >> "diagpatch.py" echo     s = p.read_text()
          >> "diagpatch.py" echo     s2 = s.replace('#if __has_cpp_attribute(msvc::no_unique_address)', '#if 0')
          >> "diagpatch.py" echo     if s2 != s:
          >> "diagpatch.py" echo         p.write_text(s2)
          >> "diagpatch.py" echo         hit += 1
          >> "diagpatch.py" echo         print('patched', f)
          >> "diagpatch.py" echo print('patched files', hit)
          python diagpatch.py > "diagnostics\proxy.log" 2>&1
          type "diagnostics\proxy.log"
          call bootstrap.cmd build native > "diagnostics\build.log" 2>&1
          if errorlevel 1 exit /b 1
          exit /b 0

      - uses: actions/upload-artifact@v4
        with:
          name: ysm-dll-windows-x64
          path: "**/ysm.dll"
          if-no-files-found: error

      - name: report diagnostics
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem diagnostics -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "::group:: $($_.Name)"
            Get-Content $_.FullName -Tail 30 | ForEach-Object { Write-Host ('::error::' + $_.Replace('%', '%25')) }
            Write-Host '::endgroup::'
          }

      - name: publish logs
        if: failure()
        shell: pwsh
        run: |
          git config user.name 'ysm-ci'
          git config user.email 'ysm-ci@users.noreply.github.com'
          git add -f diagnostics
          git commit -m "diagnostics for run $env:GITHUB_RUN_NUMBER"
          git push --force origin "HEAD:diagnostics/run-$env:GITHUB_RUN_NUMBER"


