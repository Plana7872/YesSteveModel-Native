name: build-native

on:
  workflow_dispatch:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force diagnostics | Out-Null
          Start-Transcript diagnostics/transcript.log -Force | Out-Null
          try {
            $llvm = @('C:\Program Files\LLVM\bin', 'C:\Program Files (x86)\LLVM\bin') |
              Where-Object { Test-Path (Join-Path $_ 'clang-cl.exe') } | Select-Object -First 1
            if (-not $llvm) {
              choco install llvm -y --no-progress
              $llvm = 'C:\Program Files\LLVM\bin'
            }
            if (-not (Test-Path (Join-Path $llvm 'clang-cl.exe'))) { throw "clang-cl missing under $llvm" }
            $env:Path = "$llvm;$env:Path"
            $llvm | Out-File $env:GITHUB_PATH -Append -Encoding utf8
            "CC=clang-cl`nCXX=clang-cl`nCFLAGS=-fuse-ld=lld`nCXXFLAGS=-fuse-ld=lld" |
              Out-File $env:GITHUB_ENV -Append -Encoding utf8
            clang-cl --version | Select-Object -First 1
            $zip = Join-Path $env:RUNNER_TEMP nasm.zip
            Invoke-WebRequest 'https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/win64/nasm-2.16.03-win64.zip' -OutFile $zip
            Expand-Archive $zip (Join-Path $env:RUNNER_TEMP nasm) -Force
            $n = (Get-ChildItem (Join-Path $env:RUNNER_TEMP nasm) -Recurse -Filter nasm.exe |
                    Select-Object -First 1).DirectoryName
            $n | Out-File $env:GITHUB_PATH -Append -Encoding utf8
            $env:Path = "$n;$env:Path"
            nasm -v
            python -m pip install --upgrade "conan>=2.28" "cmake>=3.29" ninja
            if ($LASTEXITCODE -ne 0) { throw 'pip install failed' }
            $env:CONAN_HOME = Join-Path $PWD 'conan\cache'
            New-Item -ItemType Directory -Force (Join-Path $env:CONAN_HOME 'profiles') | Out-Null
            $v = [int]([regex]::Match((clang-cl --version)[0], '\d+').Value)
            foreach ($c in @($v, $v - 1, $v - 2, 20, 19, 18, 17) | Select-Object -Unique) {
              @(
                '[settings]',
                'os=Windows',
                'arch=x86_64',
                'build_type=Release',
                'compiler=clang',
                "compiler.version=$c",
                'compiler.cppstd=23',
                'compiler.runtime=static',
                'compiler.runtime_type=Release',
                '',
                '[conf]',
                'tools.build:compiler_executables={"c": "clang-cl", "cpp": "clang-cl"}'
              ) | Set-Content (Join-Path $env:CONAN_HOME 'profiles\default') -Encoding utf8
              conan profile show -pr default *> diagnostics\conan-profile.log
              if ($LASTEXITCODE -eq 0) { break }
              Get-Content diagnostics\conan-profile.log -Tail 5
            }
            conan profile show -pr default
            if ($LASTEXITCODE -ne 0) { throw 'no usable clang conan profile' }
          } finally {
            try { Stop-Transcript | Out-Null } catch { }
          }

      - name: build
        shell: cmd
        run: |
          set CONAN_HOME=%CD%\conan\cache
          mkdir diagnostics 2>nul
          call bootstrap.cmd setup > diagnostics\setup.log 2>&1
          if errorlevel 1 ( type diagnostics\setup.log & exit /b 1 )
          call bootstrap.cmd build native > diagnostics\build.log 2>&1
          if errorlevel 1 ( type diagnostics\build.log & exit /b 1 )

      - uses: actions/upload-artifact@v4
        with:
          name: ysm-dll-windows-x64
          path: "**/ysm.dll"
          if-no-files-found: error

      - name: publish logs
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force diagnostics | Out-Null
          Get-ChildItem diagnostics -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "::group:: $($_.Name)"
            Get-Content $_.FullName -Tail 60 | ForEach-Object { Write-Host ('::error::' + $_.Replace('%', '%25')) }
            Write-Host '::endgroup::'
          }
          git config user.name ysm-ci
          git config user.email ysm-ci@users.noreply.github.com
          git add -f diagnostics
          if (git status --porcelain -- diagnostics) {
            git commit -m "diagnostics $env:GITHUB_RUN_NUMBER"
          } else {
            'no diagnostics written' | Out-File diagnostics/empty.log
            git add -f diagnostics
            git commit -m "diagnostics $env:GITHUB_RUN_NUMBER (empty)"
          }
          git push --force origin "HEAD:diagnostics/run-$env:GITHUB_RUN_NUMBER"
