name: build-native

on:
  workflow_dispatch:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force diagnostics | Out-Null
          $log = 'diagnostics/toolchain.log'
          function w($m) { "$((Get-Date).ToString('HH:mm:ss')) $m" | Add-Content $log }
          $llvm = @('C:\Program Files\LLVM\bin', 'C:\Program Files (x86)\LLVM\bin') |
            Where-Object { Test-Path (Join-Path $_ 'clang-cl.exe') } | Select-Object -First 1
          if (-not $llvm) { throw 'clang-cl.exe not found under the known LLVM directories' }
          $llvm | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          "CC=clang-cl`nCXX=clang-cl`nCFLAGS=-fuse-ld=lld`nCXXFLAGS=-fuse-ld=lld" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $banner = (& (Join-Path $llvm 'clang-cl.exe') --version | Select-Object -First 1)
          $major = [regex]::Match($banner, '\d+').Value
          "YSM_CLANG_MAJOR=$major" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          w "llvm=$llvm $banner"
          $zip = Join-Path $env:RUNNER_TEMP 'nasm.zip'
          curl.exe -fSsL --retry 2 --max-time 300 -o $zip 'https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/win64/nasm-2.16.03-win64.zip'
          if ($LASTEXITCODE -ne 0) { throw "nasm download failed ($LASTEXITCODE)" }
          Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'nasm') -Force
          $dir = (Get-ChildItem (Join-Path $env:RUNNER_TEMP 'nasm') -Recurse -Filter nasm.exe).DirectoryName |
            Select-Object -First 1
          $dir | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          w "nasm=$dir"

      - name: pip tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $log = 'diagnostics/pip.log'
          function w($m) { "$((Get-Date).ToString('HH:mm:ss')) $m" | Add-Content $log }
          python -m pip install --upgrade "conan>=2.28" "cmake>=3.29" ninja *>&1 | Add-Content $log
          if ($LASTEXITCODE -ne 0) { throw "pip install failed ($LASTEXITCODE)" }
          $conan = Join-Path (Split-Path (Get-Command python).Source) 'Scripts\conan.exe'
          if (-not (Test-Path $conan)) { throw "conan.exe missing at $conan" }
          $conan | Split-Path | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          "YSM_CONAN=$conan" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          w "$(& $conan --version 2>&1)"

      - name: git probe
        shell: cmd
        run: |
          if not exist diagnostics mkdir diagnostics
          git --version > "diagnostics\git.log" 2>&1
          git ls-remote https://github.com/google/benchmark refs/tags/v1.10.0 >> "diagnostics\git.log" 2>&1
          echo ls-remote=%ERRORLEVEL% >> "diagnostics\git.log"
          git clone --depth 1 -b v1.10.0 https://github.com/google/benchmark "%RUNNER_TEMP%\probe-benchmark" >> "diagnostics\git.log" 2>&1
          echo clone-benchmark=%ERRORLEVEL% >> "diagnostics\git.log"
          type "diagnostics\git.log"

      - name: setup
        shell: cmd
        run: |
          set CONAN_HOME=%CD%\conan\cache
          if not exist diagnostics mkdir diagnostics
          call bootstrap.cmd setup > "diagnostics\setup.log" 2>&1
          if errorlevel 1 ( exit /b 1 )

      - name: profile
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $log = 'diagnostics/conan.log'
          function w($m) { "$((Get-Date).ToString('HH:mm:ss')) $m" | Add-Content $log }
          $home = Join-Path $PWD 'conan\cache'
          $env:CONAN_HOME = $home
          "CONAN_HOME=$home" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          New-Item -ItemType Directory -Force (Join-Path $home 'profiles') | Out-Null
          $lines = @(
            '[settings]',
            'os=Windows',
            'arch=x86_64',
            'build_type=Release',
            'compiler=clang',
            "compiler.version=$($env:YSM_CLANG_MAJOR)",
            'compiler.runtime_version=v144',
            'compiler.cppstd=23',
            'compiler.runtime=static',
            'compiler.runtime_type=Release',
            '',
            '[conf]',
            'tools.build:compiler_executables={"c": "clang-cl", "cpp": "clang-cl"}'
          )
          $profile = Join-Path $home 'profiles\default'
          [IO.File]::WriteAllLines($profile, $lines)
          w "wrote $profile"
          & $env:YSM_CONAN profile show -pr default *>&1 | Add-Content $log
          w "profile show exit=$LASTEXITCODE"

      - name: build
        shell: cmd
        run: |
          set CONAN_HOME=%CD%\conan\cache
          call bootstrap.cmd build native > "diagnostics\build.log" 2>&1
          if errorlevel 1 ( exit /b 1 )

      - uses: actions/upload-artifact@v4
        with:
          name: ysm-dll-windows-x64
          path: "**/ysm.dll"
          if-no-files-found: error

      - name: report diagnostics
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem diagnostics -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "::group:: $($_.Name)"
            Get-Content $_.FullName -Tail 30 | ForEach-Object { Write-Host ('::error::' + $_.Replace('%', '%25')) }
            Write-Host '::endgroup::'
          }

      - name: publish logs
        if: failure()
        shell: pwsh
        run: |
          git config user.name 'ysm-ci'
          git config user.email 'ysm-ci@users.noreply.github.com'
          git add -f diagnostics
          git commit -m "diagnostics for run $env:GITHUB_RUN_NUMBER"
          git push --force origin "HEAD:diagnostics/run-$env:GITHUB_RUN_NUMBER"

