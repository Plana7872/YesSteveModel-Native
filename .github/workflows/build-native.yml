# Build the YSM native core (ysm.dll) on GitHub's Windows runner.
#
# Why: the native core lives in the separate YesSteveModel/YesSteveModel-Native
# repository and has no published binaries and no CI of its own. A local build
# needs Visual Studio 2022 with the C++ workload, which not every machine has.
# windows-2022 runners ship MSVC + Windows SDK + CMake + Ninja, so the whole
# thing can be built in the cloud for free and downloaded as an artifact.
#
# Usage: copy this file into a fork of YesSteveModel-Native as
#   .github/workflows/build-native.yml
# then Actions -> build-native -> Run workflow, and download the
# "ysm-dll-windows-x64" artifact when it finishes.
#
# The build scripts accept a plain MSVC toolchain: conan/cmake/targets/
# windows-x64.cmake only adds clang-specific flags when the compiler is Clang,
# and `bootstrap.cmd build native` is required to use the PATH toolchain
# (--toolchain is rejected for the `native` profile).
#
# Notes learned the hard way:
# - NASM is fetched as the official release zip and put on PATH through
#   GITHUB_PATH. The Chocolatey package runs the vendor NSIS installer, which
#   never refreshes the PATH of the running step (and its exit-code contract
#   differs between versions), so it is only the fallback.
# - Every step tees its output into diagnostics/, and a failure-only step
#   commits that log to a diagnostics branch: the workflow log itself needs a
#   token to read, a committed file does not.
# - CONAN_HOME must point at the repo-local conan/cache: bootstrap.cmd sets it
#   the same way, and the detected profile + exported recipes live there.

name: build-native

on:
  workflow_dispatch:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable the MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install NASM
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path diagnostics | Out-Null
          $log = 'diagnostics/nasm-install.log'
          $ProgressPreference = 'SilentlyContinue'
          $zip = Join-Path $env:RUNNER_TEMP 'nasm.zip'
          $url = 'https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/win64/nasm-2.16.03-win64.zip'
          try {
            Invoke-WebRequest -Uri $url -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'nasm') -Force
            $exe = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'nasm') -Recurse -Filter nasm.exe |
                     Select-Object -First 1
            if (-not $exe) { throw 'nasm.exe missing from the release zip' }
            $exe.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            $env:Path = "$($exe.DirectoryName);$env:Path"
            "nasm from $url -> $($exe.DirectoryName)" | Tee-Object -FilePath $log -Append
          } catch {
            "release zip failed: $_ ; falling back to Chocolatey" | Tee-Object -FilePath $log -Append
            choco install nasm -y --no-progress 2>&1 | Tee-Object -FilePath $log -Append
            $machine = [Environment]::GetEnvironmentVariable('Path', 'Machine')
            $user = [Environment]::GetEnvironmentVariable('Path', 'User')
            $env:Path = "$machine;$user"
          }
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) {
            "nasm still not on PATH" | Tee-Object -FilePath $log -Append
            throw 'nasm still not on PATH after install'
          }
          nasm -v 2>&1 | Tee-Object -FilePath $log -Append

      - name: Install Conan, CMake and Ninja
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path diagnostics | Out-Null
          $log = 'diagnostics/python-tools.log'
          python -m pip install --upgrade "conan>=2.28" "cmake>=3.29" ninja 2>&1 |
            Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { throw "pip install failed ($LASTEXITCODE)" }
          python -m pip show conan 2>&1 | Select-String -Pattern '^Version' | Tee-Object -FilePath $log -Append
          cmake --version 2>&1 | Tee-Object -FilePath $log -Append
          ninja --version 2>&1 | Tee-Object -FilePath $log -Append
          conan --version 2>&1 | Tee-Object -FilePath $log -Append

      - name: Detect the Conan profile in the repo-local cache
        shell: cmd
        run: |
          set CONAN_HOME=%CD%\conan\cache
          mkdir diagnostics 2>nul
          conan profile detect --force > diagnostics\conan-profile.log 2>&1
          type diagnostics\conan-profile.log
          if errorlevel 1 exit /b 1
          type "%CONAN_HOME%\profiles\default"

      - name: Index the dependency recipes
        shell: cmd
        run: |
          mkdir diagnostics 2>nul
          call bootstrap.cmd setup > diagnostics\bootstrap-setup.log 2>&1
          set RC=%ERRORLEVEL%
          type diagnostics\bootstrap-setup.log
          if not %RC%==0 exit /b %RC%

      - name: Build the native core
        shell: cmd
        run: |
          mkdir diagnostics 2>nul
          call bootstrap.cmd build native > diagnostics\bootstrap-build.log 2>&1
          set RC=%ERRORLEVEL%
          type diagnostics\bootstrap-build.log
          if not %RC%==0 exit /b %RC%

      - name: Report what was produced
        shell: pwsh
        run: |
          $dlls = Get-ChildItem -Recurse -Filter ysm.dll -ErrorAction SilentlyContinue
          if (-not $dlls) { throw 'no ysm.dll was produced' }
          foreach ($d in $dlls) { "{0}  {1:N0} B" -f $d.FullName, $d.Length }

      - name: Upload ysm.dll
        uses: actions/upload-artifact@v4
        with:
          name: ysm-dll-windows-x64
          path: "**/ysm.dll"
          if-no-files-found: error

      # The Actions log requires a token to read; annotations and a committed
      # file do not. Both are produced here so a failure can be diagnosed
      # without asking anyone to open the run in a browser.
      - name: Publish diagnostics on failure
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path diagnostics | Out-Null

          function Emit([string] $message) {
            $flat = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            if ($flat.Trim().Length -gt 0) { Write-Host "::error::$flat" }
          }

          $logs = Get-ChildItem diagnostics -Filter *.log -ErrorAction SilentlyContinue
          if (-not $logs) { Emit "no diagnostics log was written before the failure" }
          foreach ($log in $logs) {
            Emit "=== $($log.Name) (tail) ==="
            Get-Content $log.FullName -Tail 25 | ForEach-Object { Emit $_ }
          }

          # Best effort: keep the full logs in the repository as well.
          try {
            git config user.name "ysm-ci"
            git config user.email "ysm-ci@users.noreply.github.com"
            git checkout -B "diagnostics/run-${{ github.run_number }}"
            git add -f diagnostics
            git commit -m "diagnostics for run ${{ github.run_number }}"
            git push --force origin "HEAD:diagnostics/run-${{ github.run_number }}"
          } catch {
            Write-Host "diagnostics were not committed: $_"
          }
